name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/multi-agent-handoff -v
      - run: python -m continuum --help
      - run: node --check continuum/ui/app.js
      - run: python -m pip install .
      - run: continuum --version
      - run: node bin/continuum.js --version
      - run: npm pack --dry-run
      - run: >-
          python -c "import subprocess; result = subprocess.run('npm pack --dry-run', shell=True, capture_output=True, text=True, check=True); output = result.stdout + result.stderr; assert '__pycache__' not in output; assert 'examples/multi-agent-handoff/app.py' in output"
      - run: npm install --global .
      - run: continuum --version
      - run: continuum init --project "${{ runner.temp }}/continuum-smoke"
      - run: continuum status --project "${{ runner.temp }}/continuum-smoke"
