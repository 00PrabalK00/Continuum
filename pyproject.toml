[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-agent-memory"
version = "0.1.0"
description = "Local shared memory and orchestration infrastructure for AI coding agents and model providers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Continuum contributors"}]
keywords = ["ai", "agents", "codex", "claude", "gemini", "ollama", "openrouter", "obsidian", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
continuum = "continuum.cli:main"

[tool.setuptools.packages.find]
include = ["continuum*"]

[tool.setuptools.package-data]
continuum = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
