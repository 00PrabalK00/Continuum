<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Continuum</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <img class="mark" src="/logo.png" alt="">
        <span class="wordmark">Continuum</span>
        <span class="project" id="project"></span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="now">Now</button>
        <button class="tab" data-view="history">History</button>
        <button class="tab" data-view="notes">Notes</button>
        <button class="tab" data-view="advanced">Advanced</button>
      </nav>
    </header>

    <main id="view"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
